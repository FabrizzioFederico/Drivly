<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tu reserva · Drivly</title>
  <style>
    :root { color-scheme: light dark; --fondo: #f2f4f5; --tarjeta: #ffffff; --texto: #1d2327; --suave: #5b6670; }
    @media (prefers-color-scheme: dark) { :root { --fondo: #0b0f10; --tarjeta: #161b1d; --texto: #eef2f3; --suave: #9aa6ad; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
           background: var(--fondo); color: var(--texto); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { width: 100%; max-width: 420px; background: var(--tarjeta); border-radius: 16px; padding: 32px 24px; text-align: center; }
    .logo { display: inline-grid; place-items: center; width: 48px; height: 48px; border-radius: 12px; background: #00C2A8;
            color: #0f1416; font-weight: 800; font-size: 24px; }
    h1 { margin: 20px 0 8px; font-size: 24px; }
    p { margin: 0 0 24px; line-height: 1.5; color: var(--suave); }
    a.boton { display: block; padding: 14px; border-radius: 10px; background: #00C2A8; color: #0f1416; font-weight: 700; text-decoration: none; }
    a.otro { display: inline-block; margin-top: 16px; color: var(--suave); font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <span class="logo">D</span>
    <h1>Tu reserva en Drivly</h1>
    <p>Abrila en la app para ver el QR, cómo llegar o cancelarla. Si no tenés la app en este teléfono, ingresá desde el celular donde la usás.</p>
    <a class="boton" id="abrir" href="{{ link_android }}">Abrir en la app</a>
    <a class="otro" href="{{ link_app }}">¿No se abrió? Probá con este link</a>
  </main>
  <script>
    // En Android intenta abrir la app sola; si no la tiene instalada, queda esta página con el botón
    if (/Android/i.test(navigator.userAgent)) { setTimeout(function () { location.href = "{{ link_android|escapejs }}"; }, 300); }
  </script>
</body>
</html>
